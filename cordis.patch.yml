# dsh-forge bundle patch
#
# 清洗 + 演练台都在本插件内（lib/redteam、presets/redteam、skills/redteam）。
# 只装 dsh-forge，不外接、不 link 其它红队包。

# 关掉旧的独立红队包行（若用户以前装过 dsh-redteam-mode）
- id: redteam-store
  name: dsh-redteam-store
  disabled: true

- id: redteam-ui
  name: dsh-redteam-ui
  disabled: true

- id: redteam-mode
  name: dsh-redteam-mode
  disabled: true

- id: redteam-mode-store
  name: dsh-redteam-mode/store
  disabled: true

- id: redteam-mode-ui
  name: dsh-redteam-mode/ui
  disabled: true

- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: ""
    personaSuffix: Your working directory is {{cwd}}.

# ── 权限档位 ────────────────────────────────────────────────────────────────
#
# 全部交给官方 @deepseek-ai/dsh-permission-presets；本插件不再自己造开关，
# 面板「环境」页的按钮就是这套预设的原生入口（读 catalog / 写 apply）。
#
# 三档的 approval 一律 never：原生语义是「从不询问 → 直接拒绝」，
# 所以任何档位都不会弹确认框，越界只会返回沙箱原生错误（模型照常处理）。
#
# 补丁引擎里旧的权限覆盖（#6/#9/#15/#16 等 19 条）已退役，见 lib/core.js
# 的 RETIRED_PATCH_IDS —— 它们会把这里的执行层重新拆掉。
- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: never

- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: never
        name: 只读
        description: 不可写入文件。
      read-only-ask:
        sandbox: read-only
        approval: ask
        name: 只读（越界询问）
        description: 不可写入；越界写入可申请一次放宽。
      workspace-write:
        sandbox: workspace-write
        approval: never
        name: 工作区可写
        description: 仅当前工作区可写。
      workspace-write-ask:
        sandbox: workspace-write
        approval: ask
        name: 工作区可写（越界询问）
        description: 仅工作区可写；区外可申请一次放宽。
      danger-full-access:
        sandbox: danger-full-access
        approval: never
        name: 完全访问
        description: 不限路径（默认）。
    defaultPreset: danger-full-access

- id: dsh-forge
  inject: [systemPrompt, tools]

- insert:
    - id: dsh-forge
      name: 'dsh-forge'
      inject: [systemPrompt, tools]
      config:
        enabled: true
        autoApplyOnStart: false
        autoUpdateOnStart: false
        autoRevertOnMissing: false
        injectOnce: false
        stripMnemon: true
        verbose: false
        postPrompt: ""
        postPromptOrder: 5100
        autoRetry: true
        retryMax: 3
        autoContinue: false
        continueMax: 3
        continueText: "继续"
        hooksDenyBypass: true

    # 演练台：预设 + 技能落地（本插件 lib/redteam）
    - id: dsh-forge-redteam
      name: dsh-forge/redteam

    # 演练台事实库（SQLite），数据在 $DSH_HOME/redteam
    - id: dsh-forge-redteam-store
      name: dsh-forge/redteam/store
      config:
        root: !!js dshHomePath('redteam')

    # 演练台 HTTP 桥 POST /redteam/api
    - id: dsh-forge-redteam-ui
      name: dsh-forge/redteam/ui

    # 破解模式：逆向破解 agent（本插件 lib/crack，借鉴红队模式架构新增）
    # 预设「破解模式」注册进模式下拉框；技能/角色稿落在 $DSH_HOME/crack/
    - id: dsh-forge-crack
      name: dsh-forge/crack
      config:
        enabled: true

